<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Reconnect · super perps</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        background: #000;
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        color: #f5f5f6;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 340px;
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        margin-bottom: 16px;
        border-radius: 22px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 32px;
        line-height: 1.15;
        letter-spacing: -1px;
      }
      p {
        margin: 0 0 28px;
        color: #a5aab4;
      }
      a {
        display: block;
        padding: 14px 24px;
        border-radius: 32px;
        color: #000;
        background: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #00c78b;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 24px;
        color: #a5aab4;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/super-icon-192.png" width="192" height="192" alt="super perps" />
      <h1>Let’s get you<br />back online.</h1>
      <p>Reconnect to load current markets, balances and transactions.</p>
      <a href="/">Try again</a>
      <small
        >If a transaction was pending, check its status after reconnecting before trying it
        again.</small
      >
    </main>
  </body>
</html>
