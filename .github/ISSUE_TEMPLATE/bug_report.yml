name: Bug report
description: Report a reproducible problem in the app or starter.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead of posting exploitable details here.
        Never include wallet keys, OTPs, .env files or authenticated network captures.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the screen, action and a redacted error or screenshot if helpful. Do not use real funds solely to reproduce a report.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit/version, device, OS, browser, and whether this was a browser tab or installed PWA. Say if login was configured; do not paste credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification
      description: Was this a UI issue, mocked test, unsigned simulation, or a confirmed transaction? State what you actually observed; a submitted transaction is not necessarily confirmed.
